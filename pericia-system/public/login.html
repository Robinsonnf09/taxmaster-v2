<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Perícia Judicial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 450px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 4em;
            color: #00d4ff;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            text-align: center;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 5px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(45deg, #00d4ff, #0099ff);
        }
        
        .form-content {
            display: none;
        }
        
        .form-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1em;
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .btn {
            width: 100%;
            background: linear-gradient(45deg, #00d4ff, #0099ff);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: scale(1.02);
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 15px;
            opacity: 0.8;
        }
        
        .forgot-password a {
            color: #00d4ff;
            text-decoration: none;
        }
        
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.3);
            border: 1px solid #10b981;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <i class="fas fa-gavel"></i>
        </div>
        <h1>Sistema de Perícia Judicial</h1>
        <p class="subtitle">Tax Master</p>
        
        <div id="alert" class="alert"></div>
        
        <div class="tabs">
            <div class="tab active" onclick="mudarTab('login')">
                <i class="fas fa-sign-in-alt"></i> Login
            </div>
            <div class="tab" onclick="mudarTab('registro')">
                <i class="fas fa-user-plus"></i> Registro
            </div>
        </div>
        
        <!-- Login Form -->
        <div id="login-form" class="form-content active">
            <form onsubmit="fazerLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="seu@email.com" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-senha" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
                
                <div class="forgot-password">
                    <a href="#"><i class="fas fa-key"></i> Esqueceu a senha?</a>
                </div>
            </form>
        </div>
        
        <!-- Registro Form -->
        <div id="registro-form" class="form-content">
            <form onsubmit="fazerRegistro(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registro-nome" placeholder="Seu nome completo" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="registro-email" placeholder="seu@email.com" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>CPF</label>
                    <div class="input-group">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="registro-cpf" placeholder="000.000.000-00" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Telefone</label>
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="registro-telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registro-senha" placeholder="••••••••" required minlength="6">
                    </div>
                </div>
                
                <button type="submit" class="btn">
                    <i class="fas fa-user-plus"></i> Criar Conta
                </button>
            </form>
        </div>
    </div>
    
    <script>
        function mudarTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-content').forEach(f => f.classList.remove('active'));
            
            event.target.closest('.tab').classList.add('active');
            document.getElementById(tab + '-form').classList.add('active');
        }
        
        function mostrarAlerta(mensagem, tipo) {
            const alert = document.getElementById('alert');
            alert.textContent = mensagem;
            alert.className = `alert alert-${tipo}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }
        
        async function fazerLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    mostrarAlerta('Login realizado com sucesso!', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    mostrarAlerta(data.error || 'Erro ao fazer login', 'error');
                }
            } catch (error) {
                mostrarAlerta('Erro ao conectar com o servidor', 'error');
            }
        }
        
        async function fazerRegistro(event) {
            event.preventDefault();
            
            const dados = {
                nome: document.getElementById('registro-nome').value,
                email: document.getElementById('registro-email').value,
                cpf: document.getElementById('registro-cpf').value,
                telefone: document.getElementById('registro-telefone').value,
                senha: document.getElementById('registro-senha').value
            };
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    mostrarAlerta('Conta criada com sucesso!', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    mostrarAlerta(data.error || 'Erro ao criar conta', 'error');
                }
            } catch (error) {
                mostrarAlerta('Erro ao conectar com o servidor', 'error');
            }
        }
    </script>
</body>
</html>
